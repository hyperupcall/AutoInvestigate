<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoInvestiage</title>
<style>
/* AutoInvestigate base + live-view components (see documentation/FRONTEND_STYLE.md) */
:root{
  --ok:green;--bad:red;--wn:darkorange;
  --g-research:blue;--g-research-bg:aliceblue;
  --g-private_equity:darkorange;--g-private_equity-bg:whitesmoke;
  --g-market:purple;--g-market-bg:whitesmoke;
  --slim:blue;--slimbg:aliceblue;
}
*{box-sizing:border-box}
body{margin:0;background:whitesmoke;color:black;font:14px/1.5 system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:1px solid silver;margin-bottom:12px}
h1{font-size:15px;margin:0;font-weight:600}
.sub{color:gray;font-size:12px}
.sp{flex:1}
a{color:blue}
select,button,textarea{font:inherit;color:black}
select{background:white;border:1px solid gray;padding:4px 6px;max-width:360px}
button{border:1px solid gray;background:whitesmoke;padding:6px 12px;cursor:pointer}
button:hover{background:gainsboro}
button.primary{font-weight:600}
button:disabled{color:gray;cursor:not-allowed}

/* now banner */
#now{display:flex;gap:12px;align-items:center;background:white;border:1px solid silver;padding:10px 12px;margin-bottom:12px}
#now .dot{width:10px;height:10px;border-radius:50%;background:var(--wn);flex:none;animation:pulse 1.1s infinite}
#now.idle .dot{animation:none;background:gray}
#now.done .dot{animation:none;background:green}
#now.err .dot{animation:none;background:red}
#nowt{font-size:15px;font-weight:600}
#nows{color:gray;font-size:13px}
@keyframes pulse{50%{opacity:.25}}
.idea-shown{font-size:13px;color:gray;margin:0 0 10px 2px}
.idea-shown b{color:black}
/* stepper */
.steps{display:flex;gap:5px;margin-bottom:12px;flex-wrap:wrap}
.step{flex:1;min-width:96px;border:1px solid silver;padding:6px 10px;background:white;font-size:12px;color:gray}
.step b{display:block;font-size:13px;color:gray;font-weight:600}
.step.done{background:whitesmoke}
.step.done b{color:green}
.step.on{border-color:darkorange}
.step.on b{color:black}
.step.skip{color:gainsboro;text-decoration:line-through}
/* columns */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(max-width:1000px){.cols{grid-template-columns:1fr}}
.col{background:white;border:1px solid silver;border-top:3px solid var(--gc);display:flex;flex-direction:column;min-height:420px}
.colh{padding:8px 10px;border-bottom:1px solid silver;background:var(--gbg)}
.colh h2{font-size:14px;margin:0;color:var(--gc);font-weight:600}
.colh .mode{font-size:12px;color:gray}
.roster{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:white;font-weight:600;font-size:12px;display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.av.speaking{outline:2px solid var(--ac);outline-offset:2px;animation:pulse 1.1s infinite}
.av.writing::after{content:'✎';position:absolute;right:-5px;bottom:-5px;font-size:11px;background:white;color:black;border:1px solid silver;width:16px;height:16px;display:flex;align-items:center;justify-content:center}
.feed{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:62vh}
.divider{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gc);border-top:1px dashed silver;padding-top:8px;margin-top:2px}
.divider span{display:block;text-transform:none;letter-spacing:0;font-weight:400;color:gray}
.msg{display:flex;gap:8px}
.msg .av{width:26px;height:26px;font-size:11px}
.bub{flex:1;background:whitesmoke;border:1px solid gainsboro;padding:6px 10px;min-width:0}
.who{font-size:12px;color:gray}.who b{color:var(--ac);font-size:13px}.who i{font-style:normal;color:gray;font-size:11px;margin-left:4px}
.txt{white-space:pre-wrap;word-wrap:break-word;font-size:13px}
.thinking{font-size:12px;color:gray;padding-left:34px}
.dots::after{content:'';animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
details.eval{border:1px solid silver;border-left:3px solid var(--ac);padding:6px 10px;background:white}
details.eval summary{cursor:pointer;font-size:13px}
details.eval summary b{color:var(--ac)}
details.eval .key{display:block;color:gray;font-size:12px;margin-top:2px}
details.eval .txt{margin-top:8px;font-size:13px}
.fail{font-size:12px;color:red}
.summary{border:1px solid var(--gc);background:whitesmoke;padding:8px 10px}
.summary h3{margin:0 0 4px;font-size:13px;color:var(--gc);font-weight:600}
.summary .sec{margin-top:6px}.summary .sec b{font-size:11px;letter-spacing:.05em;color:gray}
.summary .sec .txt{font-size:13px}
.summary details summary{cursor:pointer;font-size:12px;color:gray;margin-top:6px}
/* decision + final */
.decide{margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.card{background:white;border:1px solid silver;padding:10px 12px}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:gray;margin:0 0 8px;font-weight:600}
.badge{display:inline-block;font-weight:600;border:1px solid silver;padding:2px 8px;font-size:12px;margin-right:8px}
.badge.stopped{color:gray}.badge.go{color:green;border-color:green}.badge.kept{color:darkorange;border-color:darkorange}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
@media(max-width:700px){.pc{grid-template-columns:1fr}}
.pc ul{margin:4px 0 0;padding-left:18px}.pc li{margin-bottom:3px}
.pc .p b{color:green}.pc .c b{color:red}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media(max-width:1000px){.g3{grid-template-columns:1fr}}
.gcard{border:1px solid silver;border-top:3px solid var(--gc);padding:8px 10px}
.gcard h3{margin:0 0 4px;font-size:14px;color:var(--gc);font-weight:600}
.gcard .hl{font-weight:600;margin-bottom:4px}
.gcard .txt{font-size:13px}
.headline{font-size:18px;font-weight:700;line-height:1.3}
.final.done{border:1px solid green}
.score{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 26px;gap:6px;align-items:center;font-size:12px;margin-top:4px}
.bar{height:6px;background:whitesmoke;border:1px solid silver;overflow:hidden}.bar i{display:block;height:100%;background:var(--gc)}
/* agntcy */
.slim{margin-top:12px;background:aliceblue;border:1px solid blue;padding:10px 12px;font-size:13px}
.slim b{color:blue}
.eps{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ep{font-size:11px;border:1px solid silver;background:white;padding:2px 7px;color:gray;font-family:monospace}
.ep.on{border-color:blue;color:blue;font-weight:600}
.note{font-size:13px;color:red;margin-top:8px}
.empty{color:gray;font-size:13px;text-align:center;padding:30px 10px}
code{font-family:monospace;font-size:12px}
</style>
</head>
<body><div class="wrap">
<header>
  <h1>AutoInvestiage</h1>
  <span class="sub">Three groups of AI agents evaluate an idea over AGNTCY</span>
  <div class="sp"></div>
  <select id="runs" title="Open a past evaluation"></select>
  <select id="speed" title="Replay speed"><option value="1">1x</option><option value="2" selected>2x</option><option value="4">4x</option><option value="8">8x</option><option value="0">instant</option></select>
  <button id="replay" title="Play the selected evaluation from the start">Replay</button>
  <a href="/settings">Settings</a>
</header>

<div id="now" class="idle"><div class="dot"></div><div><div id="nowt">No evaluation selected</div><div id="nows">Pick a past evaluation from the list above, or start one from the app.</div></div></div>
<div class="idea-shown" id="ideaShown"></div>
<div class="steps" id="steps"></div>
<div class="cols" id="cols"></div>
<div class="decide" id="decide"></div>
<div class="slim" id="slim"></div>
</div>

<script>
const STEPS = [['deliberation_1','Discuss','each group talks it through'],['evaluation_1','Evaluate','every member writes up'],['summary_1','Summarize','pros and cons per group'],
  ['deliberation_2','Discuss again','after reading all summaries'],['evaluation_2','Re-evaluate','scores and verdicts'],['summary_2','Summarize','updated pros and cons'],
  ['stop_go','Stop or go?','is another round worth it'],['round_3','Extra round','only if needed'],['final','Verdict','conclusions per group']];
const STAGE_LABEL = {deliberation_1:['Round 1: discussion','members speak one at a time and hear everything said'],evaluation_1:['Round 1: evaluations','each member writes up their view in their own format'],
  summary_1:['Round 1: group summary',''],deliberation_2:['Round 2: discussion','after reading every group\'s summary'],evaluation_2:['Round 2: re-evaluations','with pros, cons and scores'],
  summary_2:['Round 2: group summary',''],deliberation_3:['Extra round: discussion','to settle the open questions'],evaluation_3:['Extra round: evaluations',''],summary_3:['Extra round: group summary','']};
const MODE = {converge:'aims for a shared view', diverge:'different customers, not expected to agree'};
const PALETTE = ['blue','darkorange','teal','purple','olive','navy','indigo','brown','darkcyan','darkmagenta','darkslateblue','sienna'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/^\s*(\*{3,}|-{3,}|_{3,})\s*$/gm, '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*\*/g, '').replace(/^#{1,6}\s*/gm, '').replace(/^\s*[*-]\s+/gm, '• ');
const initials = n => n.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean).filter(w => !['and','of','the'].includes(w.toLowerCase())).slice(0,2).map(w => w[0].toUpperCase()).join('');
let EV = [], RUN_ID = null, LIVE = false, NEXT = 0, playTimer = null, shownCount = null;

function build(evs) {
  const S = {groups: [], items: {}, speaking: {}, writing: {}, summarizing: {}, stage: null, stopgo: null, final: null, end: null,
             spent: 0, max: 1, slimCount: 0, slimLast: null, notes: [], idea: '', agentColor: {}, agentName: {}, agentModel: {}};
  const ensureGroup = (gid, name) => {
    if (!S.items[gid]) { S.items[gid] = []; if (!S.groups.find(g => g.id === gid)) S.groups.push({id: gid, name: name || gid, consensus: 'converge', agents: []}); }
  };
  for (const e of evs) {
    if (e.spent !== undefined) S.spent = e.spent;
    if (e.kind === 'run_start') {
      S.idea = e.idea; S.max = e.max_cost || 1;
      (e.groups || []).forEach(g => { S.groups.push(g); S.items[g.id] = [];
        g.agents.forEach((a, i) => { S.agentColor[a.id] = PALETTE[(S.groups.length * 3 + i) % PALETTE.length]; S.agentName[a.id] = a.name; S.agentModel[a.id] = a.model; }); });
    }
    if (e.kind === 'slim_group') { S.slimCount++; S.slimLast = e; }
    if (e.kind === 'stage_start') {
      S.stage = e.stage;
      if (e.group) {
        ensureGroup(e.group);
        if (STAGE_LABEL[e.stage]) S.items[e.group].push({type: 'divider', stage: e.stage});
        if (e.stage.startsWith('evaluation')) S.writing[e.group] = new Set(e.order || []);
        if (e.stage.startsWith('summary')) S.summarizing[e.group] = true;
        if (e.stage.startsWith('deliberation')) S.speaking[e.group] = null;
      }
    }
    if (e.kind === 'turn_start') S.speaking[e.group] = e.agent;
    if (e.kind === 'turn' || e.kind === 'turn_failed') {
      ensureGroup(e.group); S.speaking[e.group] = null;
      if (e.name) S.agentName[e.agent] = e.name;
      S.items[e.group].push(e.kind === 'turn' ? {type: 'turn', agent: e.agent, text: e.text, model: e.model} : {type: 'fail', agent: e.agent, text: e.error});
    }
    if (e.kind === 'eval' || e.kind === 'eval_failed') {
      ensureGroup(e.group); S.writing[e.group]?.delete(e.agent);
      S.items[e.group].push(e.kind === 'eval' ? {type: 'eval', agent: e.agent, text: e.text, model: e.model, stage: e.stage} : {type: 'fail', agent: e.agent, text: 'evaluation failed: ' + e.error});
    }
    if (e.kind === 'stage_end' && e.group) { S.speaking[e.group] = null; if (String(e.stage).startsWith('evaluation')) S.writing[e.group] = new Set(); }
    if (e.kind === 'summary') { ensureGroup(e.group); S.summarizing[e.group] = false; S.items[e.group].push({type: 'summary', text: e.text, stage: e.stage}); }
    if (e.kind === 'sources') S.sources = e;
    if (e.kind === 'run_start') S.mode = e.mode;
    if (e.kind === 'stop_go') S.stopgo = e;
    if (e.kind === 'final') S.final = e;
    if (e.kind === 'note') S.notes.push(e.text);
    if (e.kind === 'run_end') S.end = e;
  }
  S.groups.forEach((g, gi) => (g.agents || []).forEach((a, i) => { S.agentColor[a.id] ||= PALETTE[(gi * 4 + i) % PALETTE.length]; S.agentName[a.id] ||= a.name; }));
  return S;
}

function stepIndex(stage) {
  if (!stage) return -1;
  if (/_3$/.test(stage)) return 7;
  return STEPS.findIndex(s => s[0] === stage);
}

function keyLines(text) {
  const out = [];
  for (const line of String(text).split('\n')) {
    if (/(verdict|recommendation|decision|reaction|overall technical risk|recommended approach)\s*[:\-]/i.test(line) || /score\s*[:\-]?\s*\d/i.test(line)) out.push(line.replace(/[*#]/g, '').trim());
    if (out.length >= 2) break;
  }
  return out;
}

function summaryHtml(text) {
  const names = ['PROS', 'CONS', 'WHERE THEY DISAGREED', 'SCORES AND VERDICTS', 'OPEN QUESTIONS'];
  const sec = {}; let cur = null;
  for (const raw of String(text).split('\n')) {
    const t = raw.replace(/[*#:]/g, '').trim().toUpperCase();
    if (names.includes(t)) { cur = t; sec[cur] = []; continue; }
    if (cur) sec[cur].push(raw);
  }
  if (!Object.keys(sec).length) return `<div class="txt">${esc(text)}</div>`;
  const block = k => sec[k] ? `<div class="sec"><b>${k}</b><div class="txt">${md(sec[k].join('\n').trim())}</div></div>` : '';
  const more = ['WHERE THEY DISAGREED', 'SCORES AND VERDICTS', 'OPEN QUESTIONS'].map(block).join('');
  return block('PROS') + block('CONS') + (more ? `<details><summary>Disagreements, scores and open questions</summary>${more}</details>` : '');
}

function render(S) {
  // banner
  const now = $('now');
  const pendingWriters = Object.values(S.writing).reduce((n, s) => n + (s ? s.size : 0), 0);
  const totalAgents = S.groups.reduce((n, g) => n + (g.agents || []).length, 0) || 13;
  if (!S.idea) { now.className = 'idle'; $('nowt').textContent = 'No evaluation selected'; $('nows').textContent = 'Pick a past evaluation from the list above, or start one from the app.'; }
  else if (S.end && S.end.status === 'done' && S.final) { now.className = 'done'; $('nowt').textContent = S.final.overall.headline; $('nows').textContent = 'Evaluation finished. The verdict for each group is below.'; }
  else if (S.end) { now.className = 'err'; $('nowt').textContent = {cancelled: 'Evaluation stopped', budget_stopped: 'Stopped at the cost limit', error: 'The evaluation hit an error'}[S.end.status] || 'Evaluation ended';
    $('nows').textContent = S.notes.slice(-1)[0] || ''; }
  else {
    now.className = ''; const st = S.stage || '';
    const n = (st.match(/_(\d)$/) || [])[1]; const roundName = n === '3' ? 'Extra round' : `Round ${n}`;
    if (st.startsWith('deliberation')) {
      $('nowt').textContent = `${roundName}: the groups are discussing the idea`;
      const who = S.groups.map(g => S.speaking[g.id] ? `${g.name}: ${S.agentName[S.speaking[g.id]]} is speaking` : null).filter(Boolean);
      $('nows').textContent = who.join('  ·  ') || (n === '1' ? 'Each member speaks in turn and hears everything said so far.' : 'They have now read every group\'s summary.');
    } else if (st.startsWith('evaluation')) { $('nowt').textContent = `${roundName}: every member is writing an evaluation`; $('nows').textContent = `${totalAgents - pendingWriters} of ${totalAgents} written`; }
    else if (st.startsWith('summary')) { $('nowt').textContent = 'Summarizing each group\'s pros and cons'; $('nows').textContent = 'The summarizer keeps the details: numbers, names and disagreements.'; }
    else if (st === 'stop_go') { $('nowt').textContent = 'Deciding whether another round would change anything'; $('nows').textContent = 'Stop or go: is there an open question the groups could still settle?'; }
    else if (st === 'final') { $('nowt').textContent = 'Writing the final verdict'; $('nows').textContent = ''; }
    else if (st === 'sources' && !S.sources) { $('nowt').textContent = 'Finding arXiv papers for the research and business groups'; $('nows').textContent = 'The market group has already started.'; }
    else { $('nowt').textContent = 'Starting the evaluation'; $('nows').textContent = 'Sending the idea to every group.'; }
  }
  $('ideaShown').innerHTML = S.idea ? `Idea under evaluation: <b>${esc(S.idea)}</b>` : '';
  // stepper
  const cur = stepIndex(S.stage); const fin = !!S.end;
  $('steps').innerHTML = STEPS.map(([k, label, hint], i) => {
    let cls = i < cur || (fin && i <= cur) ? 'done' : i === cur ? 'on' : '';
    if (k === 'round_3' && S.stopgo && S.stopgo.decision === 'stop') cls = 'skip';
    if (k === 'final' && S.final) cls = 'done';
    return `<div class="step ${cls}"><b>${i + 1}. ${label}</b>${hint}</div>`;
  }).join('');
  // columns (keep scroll position when the user scrolled up)
  const scroll = {};
  document.querySelectorAll('.feed').forEach(f => scroll[f.dataset.g] = {top: f.scrollTop, atBottom: f.scrollHeight - f.scrollTop - f.clientHeight < 60});
  $('cols').innerHTML = S.groups.length ? S.groups.map(g => {
    const gc = `--gc:var(--g-${g.id}, gray);--gbg:var(--g-${g.id}-bg, whitesmoke)`;
    const roster = (g.agents || []).map(a => {
      const cls = S.speaking[g.id] === a.id ? 'speaking' : (S.writing[g.id] && S.writing[g.id].has(a.id) ? 'writing' : '');
      return `<div class="av ${cls}" style="--ac:${S.agentColor[a.id]}" title="${esc(a.name)} (${esc(a.model)})">${initials(a.name)}</div>`; }).join('');
    const items = (S.items[g.id] || []).map(it => {
      const ac = `style="--ac:${S.agentColor[it.agent] || 'gray'}"`;
      const name = esc(S.agentName[it.agent] || it.agent);
      if (it.type === 'divider') { const [t, h] = STAGE_LABEL[it.stage]; return `<div class="divider">${t}${h ? `<span>${h}</span>` : ''}</div>`; }
      if (it.type === 'turn') return `<div class="msg" ${ac}><div class="av">${initials(S.agentName[it.agent] || it.agent)}</div><div class="bub"><div class="who"><b>${name}</b><i>${esc(it.model || '')}</i></div><div class="txt">${md(it.text)}</div></div></div>`;
      if (it.type === 'eval') { const k = keyLines(it.text);
        return `<details class="eval" ${ac}><summary><b>${name}</b> evaluation${k.map(l => `<span class="key">${esc(l)}</span>`).join('')}</summary><div class="txt">${md(it.text)}</div></details>`; }
      if (it.type === 'summary') return `<div class="summary"><h3>${g.name} summary</h3>${summaryHtml(it.text)}</div>`;
      if (it.type === 'fail') return `<div class="fail">${name}: ${esc(it.text)}</div>`;
      return '';
    }).join('');
    const sp = S.speaking[g.id];
    const thinking = sp ? `<div class="thinking"><b style="color:${S.agentColor[sp]}">${esc(S.agentName[sp])}</b> is speaking<span class="dots"></span></div>`
      : (S.writing[g.id] && S.writing[g.id].size ? `<div class="thinking">${S.writing[g.id].size} still writing<span class="dots"></span></div>`
      : (S.summarizing[g.id] ? `<div class="thinking">Summarizing<span class="dots"></span></div>` : ''));
    return `<div class="col" style="${gc}"><div class="colh"><h2>${esc(g.name)}</h2><div class="mode">${(g.agents || []).length} members · ${MODE[g.consensus] || ''}</div><div class="roster">${roster}</div></div>
      <div class="feed" data-g="${g.id}">${items || '<div class="empty">Waiting for the discussion to start</div>'}${thinking}</div></div>`;
  }).join('') : '';
  document.querySelectorAll('.feed').forEach(f => { const s = scroll[f.dataset.g]; f.scrollTop = !s || s.atBottom ? f.scrollHeight : s.top; });
  // decision and verdict
  let d = '';
  if (S.sources && (S.sources.papers || []).length) {
    d += `<div class="card"><h2>arXiv papers given to the research and business groups</h2>${S.sources.papers.map(p => `<div style="margin:3px 0"><a href="${esc(p.url)}" target="_blank">arXiv:${esc(p.id)}</a> ${esc(p.title)} <span class="sub">(${esc(p.year)}${p.authors && p.authors.length ? ', ' + esc(p.authors[0]) + ' et al.' : ''})</span></div>`).join('')}</div>`;
  }
  if (S.stopgo) {
    const sg = S.stopgo; const gname = id => (S.groups.find(g => g.id === id) || {name: id}).name;
    const o = !sg.consensus_feasible && sg.decision === 'go' ? ['kept', 'Extra round, disagreement kept', 'Ran one more round; the groups still cannot converge, so a person should decide.']
      : !sg.consensus_feasible ? ['kept', 'Disagreement kept', 'The groups cannot converge, so a person should decide.']
      : sg.decision === 'go' ? ['go', 'Extra round', 'Ran one more round to settle an open question, then finished.']
      : ['stopped', 'Stopped', 'The evidence was enough to conclude.'];
    d += `<div class="card"><h2>Deliberation: keep going or stop?</h2><div><span class="badge ${o[0]}">${o[1]}</span>
      <span class="sub">${o[2]}</span></div>
      <p>${esc(sg.overall.rationale)}</p>
      <div class="pc"><div class="p"><b>For</b><ul>${(sg.overall.pros || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="c"><b>Against</b><ul>${(sg.overall.cons || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>
      ${sg.decision === 'go' && sg.if_go_resolve ? `<p><b>The extra round should settle:</b> ${esc(sg.if_go_resolve)}</p>` : ''}
      <div class="g3">${Object.entries(sg.groups).map(([id, v]) => `<div class="gcard" style="--gc:var(--g-${id}, gray)"><h3>${esc(gname(id))}</h3><div class="txt">${esc(v.rationale)}</div></div>`).join('')}</div></div>`;
  }
  if (S.final) {
    const f = S.final; const gname = id => (S.groups.find(g => g.id === id) || {name: id}).name;
    d += `<div class="card final ${S.end ? 'done' : ''}"><h2>Verdict</h2><div class="headline">${esc(f.overall.headline)}</div><p>${esc(f.overall.conclusion || '')}</p>
      <div class="g3">${Object.entries(f.groups).map(([id, v]) => `<div class="gcard" style="--gc:var(--g-${id}, gray)"><h3>${esc(gname(id))}</h3><div class="hl">${esc(v.headline)}</div><div class="txt">${esc(v.conclusion)}</div>
        ${v.pros && v.pros.length ? `<div class="pc" style="grid-template-columns:1fr"><div class="p"><b>Pros</b><ul>${v.pros.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div><div class="c"><b>Cons</b><ul>${(v.cons || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></div></div>` : ''}
        ${Object.entries(v.scores || {}).filter(([, s]) => typeof s === 'number').map(([k, s]) => `<div class="score"><span>${esc(k)}</span><div class="bar"><i style="width:${Math.max(0, Math.min(10, s)) * 10}%"></i></div><b>${s}</b></div>`).join('')}
      </div>`).join('')}</div></div>`;
  }
  if (S.notes.length && S.end && S.end.status !== 'done') d += `<div class="card"><div class="note">${esc(S.notes.slice(-1)[0])}</div></div>`;
  $('decide').innerHTML = d;
  // AGNTCY / SLIM
  const ids = S.groups.flatMap(g => (g.agents || []).map(a => a.id));
  const on = new Set(S.slimLast ? S.slimLast.members : []);
  $('slim').innerHTML = `<b>Running on AGNTCY.</b> Each agent is its own SLIM endpoint (<code>council/agents/&lt;id&gt;</code>) and every message is an A2A message on a SLIM group.
    ${S.slimCount ? ` This evaluation has opened <b>${S.slimCount}</b> SLIM groups${S.slimLast ? `; the latest is channel <code>${esc(S.slimLast.channel.slice(0, 8))}</code> with ${S.slimLast.members.length} members (${esc(S.slimLast.purpose)})` : ''}.` : ''}
    <div class="eps">${ids.map(i => `<span class="ep ${on.has(i) ? 'on' : ''}">${esc(i)}</span>`).join('')}</div>`;
}

function show(n) { render(build(n === null ? EV : EV.slice(0, n))); }

async function poll() {
  if (!RUN_ID || !LIVE) return;
  try {
    const r = await (await fetch(`/api/runs/${RUN_ID}/events?since=${NEXT}`)).json();
    if (r.events.length) { EV = EV.concat(r.events); NEXT = r.next; if (shownCount === null) show(null);
      if (![...$('runs').options].some(o => o.value === RUN_ID)) loadRuns(); }
    if (!r.running) { LIVE = false; loadRuns(); show(shownCount); }
  } catch (e) {}
}
setInterval(poll, 1000);

async function openRun(id, live) {
  stopReplay(); RUN_ID = id; LIVE = live; NEXT = 0; EV = []; shownCount = null;
  const r = await (await fetch(`/api/runs/${id}/events?since=0`)).json();
  EV = r.events; NEXT = r.next; LIVE = r.running; show(null);
}

async function loadRuns() {
  const runs = await (await fetch('/api/runs')).json();
  $('runs').innerHTML = runs.map(r => `<option value="${r.id}" ${r.id === RUN_ID ? 'selected' : ''}>${r.started.slice(5, 16).replace('T', ' ')} · ${esc(r.idea.slice(0, 60))} (${r.status})</option>`).join('') || '<option value="">no evaluations yet</option>';
  return runs;
}

function stopReplay() { if (playTimer) clearTimeout(playTimer); playTimer = null; shownCount = null; $('replay').textContent = 'Replay'; }

function replay() {
  if (playTimer) { stopReplay(); show(null); return; }
  const speed = Number($('speed').value);
  if (!EV.length) return;
  if (!speed) { show(null); return; }
  shownCount = 0; $('replay').textContent = 'Stop replay';
  const step = () => {
    shownCount++; show(shownCount);
    if (shownCount >= EV.length) { stopReplay(); return; }
    const dt = (new Date(EV[shownCount].t) - new Date(EV[shownCount - 1].t)) || 200;
    playTimer = setTimeout(step, Math.min(Math.max(dt, 150), 4000) / speed);
  };
  step();
}

$('replay').onclick = replay;
$('runs').onchange = e => e.target.value && openRun(e.target.value, false);
(async () => {
  const st = await (await fetch('/api/status')).json();
  const runs = await loadRuns();
  const want = new URLSearchParams(location.search).get('run');
  if (want) { await openRun(want, false); $('runs').value = want; }
  else if (st.running) await openRun(st.run_id, true);
  else { const done = runs.find(r => r.status === 'done') || runs[0]; if (done) { await openRun(done.id, false); $('runs').value = done.id; } else show(null); }
})();
</script>
</body>
</html>
