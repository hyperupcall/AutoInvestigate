<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings · AutoInvestigate</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="settings-page">
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div class="brand-text">
        <h1>Settings</h1>
        <p>Models, prompts and group perspectives. API keys always live on the backend.</p>
      </div>
    </div>
    <div class="header-actions">
      <a class="btn ghost small" href="index.html">← Back to AutoInvestigate</a>
    </div>
  </header>

  <main class="settings-standalone">
    <section class="column" id="col-settings"></section>
  </main>

  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/model-info.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-backend.js"></script>
  <script src="js/api-backend.js"></script>
  <script src="js/state.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/components/toast.js"></script>
  <script>
    (function () {
      const Hack = window.Hack;
      const store = Hack.store;
      function boot() {
        Hack.components.settings.mount(document.getElementById('col-settings'));
        Hack.components.toast.mount(document.getElementById('toast-root'));
        store.subscribe(function () {
          Hack.components.settings.render();
          Hack.components.toast.render();
        });
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
      else boot();
    })();
  </script>
</body>
</html>
