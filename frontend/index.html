<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoInvestigate</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">◈</span>
      <div class="brand-text">
        <h1>AutoInvestigate</h1>
        <p>Automated research — generate, refine and stress-test ideas</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="mock-badge" title="All backend calls are mocked for now">MOCK BACKEND</span>
      <button class="btn small" id="open-settings" type="button">Settings</button>
    </div>
  </header>

  <main class="columns">
    <section class="column" id="col-generation" aria-label="Idea generation"></section>
    <section class="column" id="col-evaluation" aria-label="Idea evaluation"></section>
    <section class="column" id="col-execution" aria-label="Idea execution"></section>
  </main>

  <div id="modal-root"></div>
  <div id="settings-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-backend.js"></script>
  <script src="js/state.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/components/generation.js"></script>
  <script src="js/components/evaluation.js"></script>
  <script src="js/components/execution.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/components/settingsModal.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
