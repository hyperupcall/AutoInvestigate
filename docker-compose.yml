# Starts every service in this repo with its relevant configuration.
#
#   docker compose up --build
#
# Host ports:
#   80     caddy            the only public entry point (basic auth; see deploy/Caddyfile)
#   8000   frontend         static site (no build step)      — bound to 127.0.0.1
#   8080   artifactfactory  REST API (idea execution backend — the frontend's column 3) — bound to 127.0.0.1
#   8090   web              evaluation backend (idea evaluation — the frontend's column 2) — bound to 127.0.0.1
#   8091   ideation         ideation collective daemon (topics, monitoring, idea generation)
#   46357  slim             AGNTCY/SLIM bus (used by the evaluation agents) — bound to 127.0.0.1
#
# Caddy fronts everything on :80 with HTTP basic auth and proxies the API paths
# to the right service on the same origin, so the browser needs no CORS overrides.
#
# The evaluation backend (slim / agent_host / web) reads the single root .env
# (OPENROUTER_API_KEY, SLIM_SHARED_SECRET, ...). Copy `.env.example` to `.env` and
# fill it in, or run `cd website && ./setup.sh`, which writes it for you.
#
# Generated artifacts and state are persisted to the host via the volumes below.

name: outshift-research-intelligence

# Shared config for the evaluation backend (idea evaluation).
# The entrypoint starts as root, chowns the mounted dirs to HOST_UID:HOST_GID (Docker
# creates a missing bind-mount dir as root), then drops to that user — so the app can
# write to ./logs, ./website/data and ./website/council_results, and the files stay
# owned by you on the host. (Run ./fix-permissions.sh to repair existing dirs.)
x-deliberation-env: &deliberation-env
  CHOWN_DIRS: /app/data:/app/logs:/app/council_results
  HOST_UID: "${HOST_UID:-0}"
  HOST_GID: "${HOST_GID:-0}"

x-deliberation: &deliberation
  build: ./website
  env_file: .env
  entrypoint: ["python", "/app/docker-entrypoint.py"]
  environment: *deliberation-env
  volumes:
    - ./website/data:/app/data
    - ./logs:/app/logs
    - ./website/prompts:/app/prompts:ro
    - ./website/council_results:/app/council_results

services:
  # ------------------------------------------------------------- frontend
  frontend:
    build:
      context: ./website/frontend
    image: outshift/frontend:latest
    ports:
      - "127.0.0.1:8000:80"
    depends_on:
      - artifactfactory
    restart: unless-stopped

  # ------------------------------------------------------- idea execution
  artifactfactory:
    build:
      context: ./artifactfactory
    image: outshift/artifactfactory:latest
    # The entrypoint starts as root, chowns the mounted dirs to HOST_UID:HOST_GID
    # (Docker creates a missing bind-mount dir as root), then drops to that user, so
    # files written to _artifacts/ and _artifactfactory-data/ stay owned by you.
    entrypoint: ["python", "/app/docker-entrypoint.py"]
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env   # OPENROUTER_API_KEY: real literature review and experiment repo (artifactfactory/evaluation.py)
    environment:
      AF_HOST: 0.0.0.0
      AF_PORT: "8080"
      AF_STORAGE: local
      AF_EVAL_API: http://web:8090   # the evaluation backend, to fetch the run's report
      AF_FRONTEND_DIR: /app/frontend  # the dashboard page (website/frontend/artifactfactory.html)
      CHOWN_DIRS: /app/_artifacts:/app/_artifactfactory-data
      HOST_UID: "${HOST_UID:-0}"
      HOST_GID: "${HOST_GID:-0}"
    volumes:
      - ./_artifacts:/app/_artifacts
      - ./_artifactfactory-data:/app/_artifactfactory-data
      - ${FRONTEND_DIR:-./website/frontend}:/app/frontend:ro
    restart: unless-stopped

  # ------------------------------------------------------- idea generation
  # The ideation collective: a long-running daemon that watches the internet for
  # signals on a tagged watchlist of topics and turns them into ideas. Its SQLite
  # database lives on a named volume (./_ideation-data) so it survives a rebuild.
  ideation:
    build:
      context: ./website
    image: outshift/ideation:latest
    # The entrypoint starts as root, chowns the data volume to HOST_UID:HOST_GID
    # (Docker creates a missing bind-mount dir as root), then drops to that user,
    # so the SQLite database is owned by you on the host.
    entrypoint: ["python", "/app/docker-entrypoint.py"]
    command: ["python", "-m", "ideation.daemon"]
    ports:
      - "8091:8091"
    env_file: .env   # OPENROUTER_API_KEY for the ideation agents
    environment:
      ID_HOST: 0.0.0.0
      ID_PORT: "8091"
      ID_DATA_DIR: /app/_ideation-data   # the SQLite database (a volume)
      ID_FRONTEND_DIR: /app/frontend     # the Ideation View page (website/frontend/ideation.html)
      ID_POLL_INTERVAL: "900"
      HOST_UID: "${HOST_UID:-0}"
      HOST_GID: "${HOST_GID:-0}"
    volumes:
      - ./_ideation-data:/app/_ideation-data
      - ${FRONTEND_DIR:-./website/frontend}:/app/frontend:ro
    restart: unless-stopped

  # ------------------------------------------------------- idea evaluation
  slim:
    image: ghcr.io/agntcy/slim:1.4.0@sha256:7a7531cb81f1e24682f08364713da06a158411df3e90b687acf8d5836da5a78e
    container_name: deliberation-slim
    ports:
      - "127.0.0.1:46357:46357"
    environment:
      - PASSWORD=${SLIM_SHARED_SECRET}
      - CONFIG_PATH=/config.yaml
    volumes:
      - ./website/slim/server-config.yaml:/config.yaml
    command: ["/slim", "--config", "/config.yaml"]

  agent_host:
    <<: *deliberation
    command: python -m agent_host.main
    restart: unless-stopped
    depends_on:
      - slim

  web:
    <<: *deliberation
    command: python -m orchestrator.web
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      <<: *deliberation-env
      FRONTEND_DIR: /app/frontend
    volumes:
      - ./website/data:/app/data
      - ./logs:/app/logs
      - ./website/prompts:/app/prompts:ro
      - ./website/council_results:/app/council_results
      - ${FRONTEND_DIR:-./website/frontend}:/app/frontend:ro
    restart: unless-stopped
    depends_on:
      - slim
      - agent_host

  orchestrator:
    <<: *deliberation
    command: python -m orchestrator.cli
    profiles: ["run"]
    depends_on:
      - slim
      - agent_host

  # ------------------------------------------------------- reverse proxy (public)
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    env_file: .env   # CADDY_USER, CADDY_PASSWORD_HASH
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - artifactfactory
      - web
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
