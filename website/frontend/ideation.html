<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ideation View · AutoInvestigate</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="ideation-page">
  <header class="app-header" id="app-header"></header>

  <main class="ideation-main">
    <div class="ideation-toolbar">
      <span class="mock-badge" id="ideation-status" title="Ideation daemon status">…</span>
      <button class="btn small" id="ideation-discover" type="button" title="Let the topic finder read the internet and propose new topics">Generate topics</button>
      <button class="btn small" id="ideation-poll" type="button" title="Poll every topic now">Find Topics</button>
      <span class="muted small" id="ideation-summary"></span>
      <span class="spacer"></span>
      <button class="btn small" id="ideation-related" type="button" title="Ask Gemini for ideas vaguely related to the topics">Related ideas</button>
      <button class="btn small" id="ideation-settings" type="button" title="Models and daemon settings">Settings</button>
      <button class="btn small" id="ideation-refresh" type="button">Refresh</button>
    </div>

    <div class="ideation-columns">
      <section class="ideation-panel">
        <div class="ideation-panel-head">
          <h3>Topics</h3>
          <span class="muted small" id="ideation-topic-count"></span>
        </div>
        <div class="ideation-panel-body" id="ideation-topics"></div>
      </section>

      <section class="ideation-panel">
        <div class="ideation-panel-head">
          <h3>Sessions</h3>
          <span class="muted small" id="ideation-session-count"></span>
        </div>
        <div class="ideation-panel-body" id="ideation-sessions"></div>
      </section>

      <section class="ideation-detail">
        <div class="modal-tabs" id="ideation-tabs"></div>
        <div id="ideation-detail-body"></div>
      </section>
    </div>
  </main>

  <div id="ideation-settings-root"></div>
  <div id="ideation-topic-root"></div>
  <div id="ideation-discover-root"></div>
  <div id="info-root"></div>
  <div id="settings-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/model-info.js"></script>
  <script src="js/mcp-servers.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-backend.js"></script>
  <script src="js/mock-execution.js"></script>
  <script src="js/api-backend.js"></script>
  <script src="js/api-execution.js"></script>
  <script src="js/idea-handoff.js"></script>
  <script src="js/state.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/components/settingsModal.js"></script>
  <script src="js/components/infoModal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/ideation.js"></script>
</body>
</html>
