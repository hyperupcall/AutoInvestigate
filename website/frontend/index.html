<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AutoInvestigate</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header" id="app-header"></header>

  <main class="columns">
    <section class="column" id="col-generation" aria-label="Idea generation"></section>
    <section class="column" id="col-evaluation" aria-label="Idea evaluation"></section>
    <section class="column" id="col-execution" aria-label="Idea execution"></section>
  </main>

  <div id="modal-root"></div>
  <div id="settings-root"></div>
  <div id="info-root"></div>
  <div id="run-config-root"></div>
  <div id="variations-root"></div>
  <div id="artifact-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/model-info.js"></script>
  <script src="js/mcp-servers.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/mock-report.js"></script>
  <script src="js/mock-backend.js"></script>
  <script src="js/mock-execution.js"></script>
  <script src="js/api-backend.js"></script>
  <script src="js/api-execution.js"></script>
  <script src="js/api-generation.js"></script>
  <script src="js/state.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/components/generation.js"></script>
  <script src="js/components/evaluation.js"></script>
  <script src="js/components/execution.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/components/settingsModal.js"></script>
  <script src="js/components/infoModal.js"></script>
  <script src="js/components/runConfigModal.js"></script>
  <script src="js/components/variationsModal.js"></script>
  <script src="js/components/artifactModal.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
